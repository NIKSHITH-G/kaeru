name: Release

# Push a tag like v1.2.0 to build Kaeru.dmg and attach it to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch annotated tag contents
        run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - name: Install helpers
        run: brew install ffmpeg webp
      - name: Build app with bundled helpers, signed with the Kaeru certificate
        env:
          KAERU_SIGNING_P12_B64: ${{ secrets.KAERU_SIGNING_P12 }}
          KAERU_SIGNING_PASSWORD: ${{ secrets.KAERU_SIGNING_PASSWORD }}
        run: |
          echo "$KAERU_SIGNING_P12_B64" | base64 --decode > "$RUNNER_TEMP/kaeru-signing.p12"
          KAERU_SIGNING_P12_PATH="$RUNNER_TEMP/kaeru-signing.p12" VERSION="${GITHUB_REF_NAME#v}" scripts/build-app.sh --bundle-helpers
          rm -f "$RUNNER_TEMP/kaeru-signing.p12"
      - name: Check the release is signed with the stable certificate (keeps permissions across updates)
        run: codesign -d -r- build/Kaeru.app 2>&1 | grep 'certificate root' 
      - name: Test the release binary
        run: build/Kaeru.app/Contents/MacOS/Kaeru --self-test
      - name: Package DMG
        run: scripts/make-dmg.sh
      - name: Write release notes from commit messages since the previous tag
        run: |
          # Prefer hand-written notes in an annotated tag (git tag -a vX.Y.Z -F notes.md);
          # otherwise build them from the commit messages since the previous tag.
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag" ]; then
            git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > notes.md
            [ -s notes.md ] || git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          else
            PREV=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
            git log ${PREV:+$PREV..}"$GITHUB_REF_NAME" --no-merges --format='### %s%n%n%b' \
              | awk '/^### Bump version/ {skip=1; next} /^### / {skip=0} !skip' > notes.md
          fi
          printf '\n---\n**New to Kaeru?** Open the DMG, drag Kaeru into Applications, double-click it and click Done, then go to System Settings → Privacy & Security → Open Anyway. Step-by-step guide with pictures: https://getkaeru.vercel.app/install\n\n**Already installed?** 🐸 → Check for Updates…\n' >> notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --notes-file notes.md --title "Kaeru ${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" build/Kaeru.dmg --clobber

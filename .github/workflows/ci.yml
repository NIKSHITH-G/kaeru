name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install helpers
        run: brew install ffmpeg webp
      - name: Build
        run: swift build
      - name: Unit checks
        run: .build/debug/Kaeru --self-test
      - name: End-to-end conversions
        run: tests/e2e.sh
